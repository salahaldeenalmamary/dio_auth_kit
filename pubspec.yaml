name: dio_auth_kit
description: >-
  Bearer and JWT authentication for dio and retrofit: header injection,
  single-flight token refresh with retry, and per-endpoint auth annotations.
version: 0.1.0
repository: https://github.com/salahaldeenalmamary/dio_auth_kit
issue_tracker: https://github.com/salahaldeenalmamary/dio_auth_kit/issues
topics: [dio, retrofit, jwt, authentication, http]

environment:
  sdk: ^3.5.0

dependencies:
  dio: ^5.7.0
  meta: ^1.15.0
  retrofit: ^4.4.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
