name: dio_auth_kit_example
description: A retrofit client using dio_auth_kit annotations.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  dio: ^5.7.0
  dio_auth_kit:
    path: ../
  # 4.8+ for @RestApi(headers:), used by PublicApi's client scope.
  retrofit: ^4.8.0

dev_dependencies:
  build_runner: ^2.4.0
  lints: ^5.1.0
  retrofit_generator: ^10.1.0
  test: ^1.25.0
